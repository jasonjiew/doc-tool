# 示例 project.yml（v1 模式）——新建项目时由导入服务生成，请勿手工创建。
# 所有路径相对项目根，复制到其他机器后无需修改。
schemaVersion: 1
projectId: 00000000-0000-0000-0000-000000000000
documentType: general            # general | requirement | design
documentNo: ""                  # 通用文档可留空
documentName: 示例大文档
documentVersion: "1.0"          # 通用文档可留空
paths:
  sourceDocx: original/source.docx
  templateDocx: template/template.docx
  contentRoot: content/general
  assetRoot: assets/general
  tableRoot: assets/general/tables
sourceSha256: ""                # 导入时由源 DOCX 只读副本计算
createdWithVersion: 0.1.0
lastSuccessfulBuildVersion: null
headingStyles:                   # heading 级别 -> Word 段落样式 ID（由模板决定）
  "1": "2"
  "2": "3"
  "3": "5"
  "4": "6"
  "5": "7"
  "6": "8"
bodyStyle: "4"                   # 正文段落默认样式 ID
refresh:
  timeoutSeconds: 900
