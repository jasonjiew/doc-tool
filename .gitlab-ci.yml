# -*- coding: utf-8 -*-
# GitLab CI/CD 配置：Doc Tool Windows 构建与 Release
#
# 任务 9.3/9.4：Windows CI，校验标签/版本一致，串联全部测试。
# 任务 9.5：生产文档泄漏扫描。
# 任务 9.6：代码签名（配置证书时启用）。
# 任务 9.7：发布说明和安装器上传到 Git Release。
#
# 需要带 PowerShell 的 Windows GitLab Runner。
# Release 作业仅在 vX.Y.Z 标签上触发。

stages:
  - validate
  - test
  - build
  - package
  - release

variables:
  APP_VERSION: "2.3.2"
  PYTHON_VERSION: "3.13"
  COVERAGE_MIN: "60"

# --- 阶段 1：版本一致性校验 ---
validate-version:
  stage: validate
  tags:
    - windows
  script:
    - |
      # 校验标签版本与应用版本一致
      $tag = $env:CI_COMMIT_TAG
      if ($tag) {
        $tagVersion = $tag.TrimStart("v")
        $appVersion = python -c "from doc_tool.domain.version import APP_VERSION; print(APP_VERSION)"
        $installerLine = Select-String -Path "packaging\installer.iss" -Pattern '#define\s+MyAppVersion\s+"([^"]+)"'
        $installerVersion = $installerLine.Matches[0].Groups[1].Value
        $buildLine = Select-String -Path "packaging\build.ps1" -Pattern '\$Version\s*=\s*"([^"]+)"'
        $buildVersion = $buildLine.Matches[0].Groups[1].Value
        if ($tagVersion -ne $appVersion -or $tagVersion -ne $installerVersion -or $tagVersion -ne $buildVersion) {
          Write-Error "版本不一致: tag=$tagVersion app=$appVersion installer=$installerVersion build=$buildVersion"
          exit 1
        }
        Write-Host "版本一致: $tagVersion"
      }
    # 校验工作树干净，禁止把本地修改标记为正式 Release
    - |
      $dirty = git status --porcelain --untracked-files=all
      if ($dirty) {
        $dirty | Write-Host
        throw "工作树存在未提交或未跟踪文件，禁止正式发布"
      }
      python -c "from doc_tool.domain.version import get_commit_id; print('commit:', get_commit_id())"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

# --- 阶段 2：测试 ---
test-unit:
  stage: test
  tags:
    - windows
  script:
    - python -m pip install -r requirements.txt -r requirements-build.txt --no-cache-dir
    - python scripts\tests\run_tests.py --coverage --coverage-min $env:COVERAGE_MIN
  artifacts:
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - coverage.json
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

dependency-audit:
  stage: test
  tags:
    - windows
  script:
    - python -m pip install pip-audit==2.9.0 --no-cache-dir
    - python packaging/audit_dependencies.py --requirements requirements.txt --output dependency-audit.json
    - python packaging/audit_dependencies.py --requirements requirements-build.txt --output dependency-audit-build.json
  artifacts:
    paths:
      - dependency-audit.json
      - dependency-audit-build.json
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

generate-sbom:
  stage: test
  tags:
    - windows
  script:
    - python packaging/generate_sbom.py --requirements requirements.txt --requirements requirements-build.txt --cyclonedx sbom.cdx.json --spdx sbom.spdx.json
    - python -c "import json; c=json.load(open('sbom.cdx.json', encoding='utf-8')); s=json.load(open('sbom.spdx.json', encoding='utf-8')); assert c['bomFormat']=='CycloneDX' and c['specVersion']=='1.5'; assert s['spdxVersion']=='SPDX-2.3'"
  artifacts:
    paths:
      - sbom.cdx.json
      - sbom.spdx.json
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

# 公共发布门禁：净化源码导出 + 品牌/内网/凭据/OOXML 内容扫描（任务 9.1/8.7）。
validate-public-source:
  stage: test
  tags:
    - windows
  script:
    - |
      $ErrorActionPreference = "Stop"
      python packaging/export_public_source.py --output "$env:TEMP\doc-public-export-$env:CI_PIPELINE_ID" --scan
      if ($LASTEXITCODE -ne 0) { throw "净化公开源码导出/扫描失败" }
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

# --- 阶段 3：PyInstaller 构建 ---
build-onedir:
  stage: build
  tags:
    - windows
  needs: ["test-unit", "dependency-audit", "generate-sbom"]
  script:
    - python -m pip install -r requirements.txt -r requirements-build.txt --no-cache-dir
    - pyinstaller packaging/doc_tool.spec --noconfirm --clean
    # 冻结应用冒烟测试
    - python scripts\tests\test_frozen_smoke.py
  artifacts:
    paths:
      - dist/DocTool/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

# --- 阶段 4：安装器打包 ---
package-installer:
  stage: package
  tags:
    - windows
  needs: ["build-onedir"]
  script:
    - |
      $ErrorActionPreference = "Stop"
      python packaging/scan_leaks.py --strict
      if ($LASTEXITCODE -ne 0) { throw "生产文档泄漏/允许清单扫描失败" }

      # 公共正式发布授权门禁（任务 9.3）：未决决策阻断 tag 正式发布。
      python packaging/release_gate.py --public
      if ($LASTEXITCODE -ne 0) { throw "公共发布授权门禁未通过，仅允许内部测试产物" }

      $hasPfx = -not [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PFX)
      $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PASSWORD)
      if ($hasPfx -xor $hasPassword) {
        throw "代码签名配置不完整：证书与密码必须同时配置"
      }
      $signingEnabled = $hasPfx -and $hasPassword
      $signtool = $null
      if ($signingEnabled) {
        $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
        if (-not $signtool) { throw "已配置代码签名，但 signtool.exe 不可用" }
        $appExe = "dist\DocTool\DocTool.exe"
        & $signtool.Source sign /fd SHA256 /f $env:CODE_SIGNING_PFX /p $env:CODE_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $appExe
        if ($LASTEXITCODE -ne 0) { throw "应用程序代码签名失败" }
        & $signtool.Source verify /pa /all $appExe
        if ($LASTEXITCODE -ne 0) { throw "应用程序签名验证失败" }
      } else {
        Write-Warning "未配置代码签名证书，产出仅限受控试点"
      }

      # installer.iss 引用 ..\dist\diagnose.cmd：先把启动/诊断脚本暂存进 dist\
      # （dist/DocTool/ 来自 build-onedir 产物；dist 根的脚本需要这一步生成）。
      powershell -NoProfile -ExecutionPolicy Bypass -File packaging\stage_dist.ps1
      if ($LASTEXITCODE -ne 0) { throw "dist 暂存失败" }

      $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
      if (!(Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
      if (!(Test-Path $iscc)) { throw "Inno Setup 未安装" }
      Push-Location packaging
      try {
        & $iscc installer.iss
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }
      } finally {
        Pop-Location
      }

      # 团队分发便携包：onedir 目录 + 启动脚本 + 诊断脚本（基线自动刷新）。
      # 必须放在应用签名之后，否则包里装的是未签名 exe。
      # 装配逻辑统一在 packaging/make_portable.ps1，与本地 build_exe.ps1 -Portable 同源。
      powershell -NoProfile -ExecutionPolicy Bypass -File packaging\make_portable.ps1 -Version $env:APP_VERSION
      if ($LASTEXITCODE -ne 0) { throw "便携包生成失败" }
      $portable = "packaging\Output\DocTool-$env:APP_VERSION-portable.zip"
      $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash
      if (!(Test-Path "$portable.sha256")) { throw "便携包校验值文件缺失: $portable.sha256" }

      $exe = "packaging\Output\DocTool-Setup-$env:APP_VERSION.exe"
      powershell -NoProfile -ExecutionPolicy Bypass -File scripts\tests\test_installer_smoke.ps1 -InstallerPath $exe
      if ($LASTEXITCODE -ne 0) { throw "安装级冒烟测试失败" }

      if ($signingEnabled) {
        & $signtool.Source sign /fd SHA256 /f $env:CODE_SIGNING_PFX /p $env:CODE_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
        if ($LASTEXITCODE -ne 0) { throw "安装器代码签名失败" }
        & $signtool.Source verify /pa /all $exe
        if ($LASTEXITCODE -ne 0) { throw "安装器签名验证失败" }
      }

      # 哈希必须在所有签名完成之后生成，否则发布的校验值会失效。
      $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
      "$hash  DocTool-Setup-$env:APP_VERSION.exe" | Out-File "$exe.sha256" -Encoding ascii -NoNewline

      $sbom = "packaging\Output\DocTool-$env:APP_VERSION-sbom.txt"
      "Doc Tool $env:APP_VERSION 依赖清单（SBOM）" | Out-File $sbom -Encoding utf8
      "生成时间: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File $sbom -Append -Encoding utf8
      "PyYAML 6.0.3 (MIT), lxml 6.1.1 (BSD), Pillow 12.3.0 (MIT-CMU), pywin32 312 (PSF), Python 3.13 (PSF)" | Out-File $sbom -Append -Encoding utf8
      Copy-Item sbom.cdx.json "packaging\Output\DocTool-$env:APP_VERSION.cdx.json"
      Copy-Item sbom.spdx.json "packaging\Output\DocTool-$env:APP_VERSION.spdx.json"
  artifacts:
    paths:
      - packaging/Output/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG

# --- 阶段 5：Release 发布 ---
release-upload:
  stage: release
  tags:
    - windows
  needs: ["package-installer"]
  script:
    - |
      # 使用 GitLab Release CLI 上传安装器
      $exe = "packaging\Output\DocTool-Setup-$env:APP_VERSION.exe"
      $sha = "$exe.sha256"
      $portable = "packaging\Output\DocTool-$env:APP_VERSION-portable.zip"
      $portableSha = "$portable.sha256"
      $sbom = "packaging\Output\DocTool-$env:APP_VERSION-sbom.txt"
      $cyclone = "packaging\Output\DocTool-$env:APP_VERSION.cdx.json"
      $spdx = "packaging\Output\DocTool-$env:APP_VERSION.spdx.json"

      # 生成发布说明
      $notes = "packaging\Output\release-notes.md"
      "# Doc Tool v$env:APP_VERSION`n`n" | Out-File $notes -Encoding utf8
      "## 安装`n- 下载 DocTool-Setup-$env:APP_VERSION.exe`n- 双击运行，按提示安装`n- 默认安装到 %LOCALAPPDATA%\DocTool（无需管理员权限）`n`n" | Out-File $notes -Append -Encoding utf8
      "## 免安装（便携包）`n- 下载 DocTool-$env:APP_VERSION-portable.zip，解压到任意目录`n- 双击「启动DocTool.cmd」启动（不要单独取出 DocTool.exe，exe 依赖同目录 _internal\）`n- 该脚本每次把程序复制到 %TEMP% 下的全新目录再启动，用于绕开安全软件对未签名 exe 的拦截`n`n" | Out-File $notes -Append -Encoding utf8
      "## 验证`n- 安装器 SHA-256: $(Get-Content $sha)`n- 便携包 SHA-256: $(Get-Content $portableSha)`n`n" | Out-File $notes -Append -Encoding utf8
      "## 构建来源`n- 标签: $env:CI_COMMIT_TAG`n- 提交: $env:CI_COMMIT_SHA`n`n" | Out-File $notes -Append -Encoding utf8
      "## 本版变更`n- 自包含桌面应用与事务化 Word 项目导入`n- 受保护的校验、Word 刷新和原子发布管线`n- 按用户安装、升级与非破坏性卸载`n`n" | Out-File $notes -Append -Encoding utf8
      "## 已知限制`n- 正式合并需要交互式 Windows 会话和 Microsoft Word`n- 未配置公司代码签名证书时产物仅限受控试点`n`n" | Out-File $notes -Append -Encoding utf8
      "## 依赖`n见 SBOM 文件`n`n" | Out-File $notes -Append -Encoding utf8

      # 使用 curl 上传到 GitLab Release（需要 CI_JOB_TOKEN）
      $url = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases"
      Write-Host "Release 产物已生成，请通过 GitLab UI 或 Release CLI 发布"
      Write-Host "安装器: $exe"
      Write-Host "SHA-256: $sha"
      Write-Host "便携包: $portable"
      Write-Host "便携包 SHA-256: $portableSha"
      Write-Host "SBOM: $sbom"
      Write-Host "CycloneDX: $cyclone"
      Write-Host "SPDX: $spdx"
      Write-Host "发布说明: $notes"
  artifacts:
    paths:
      - packaging/Output/
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG
  release:
    name: "v$APP_VERSION"
    description: "packaging/Output/release-notes.md"
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "DocTool-Setup-$APP_VERSION.exe"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/packaging/Output/DocTool-Setup-$APP_VERSION.exe"
        - name: "SHA-256"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/packaging/Output/DocTool-Setup-$APP_VERSION.exe.sha256"
        - name: "DocTool-$APP_VERSION-portable.zip（免安装）"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/packaging/Output/DocTool-$APP_VERSION-portable.zip"
        - name: "便携包 SHA-256"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/packaging/Output/DocTool-$APP_VERSION-portable.zip.sha256"
        - name: "SBOM"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/packaging/Output/DocTool-$APP_VERSION-sbom.txt"
        - name: "CycloneDX SBOM"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/packaging/Output/DocTool-$APP_VERSION.cdx.json"
        - name: "SPDX SBOM"
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/file/packaging/Output/DocTool-$APP_VERSION.spdx.json"
